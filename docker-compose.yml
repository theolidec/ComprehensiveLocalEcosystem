version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: cle_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=cle_app
    networks:
      - cle_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cle_backend
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - file_uploads:/app/uploads
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/cle_app?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_refresh_secret_change_in_production}
      - FRONTEND_URL=https://localhost
      - BACKEND_URL=https://localhost
      - UPLOAD_DIR=/app/uploads/files
      - MAX_FILE_SIZE=524288000
      - MAX_STORAGE_BYTES=10737418240
    depends_on:
      - mongodb
    networks:
      - cle_network

  # Nginx Reverse Proxy with TLS Termination
  nginx:
    image: nginx:alpine
    container_name: cle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/certs:/etc/nginx/certs:ro
      - ./data/certbot/www:/var/www/html:ro
      - ./data/certbot/conf:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cle_network

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: cle_certbot
    volumes:
      - ./data/certbot/www:/var/www/html:rw
      - ./data/certbot/conf:/etc/letsencrypt:rw
    command: certonly --webroot --webroot-path=/var/www/html --email your-email@example.com --agree-tos --no-eff-email -d your-domain.com -d www.your-domain.com
    networks:
      - cle_network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cle_frontend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=https://localhost/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - cle_network

volumes:
  mongodb_data:
  file_uploads:

networks:
  cle_network:
    driver: bridge
