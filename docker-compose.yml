version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: cle_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=cle_app
    networks:
      - cle_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cle_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - file_uploads:/app/uploads
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/cle_app?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_change_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_refresh_secret_change_in_production}
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:3001
      - COLLABORA_URL=http://collabora:9980
      - UPLOAD_DIR=/app/uploads/files
      - MAX_FILE_SIZE=524288000
      - MAX_STORAGE_BYTES=10737418240
      - WOPI_TOKEN_SECRET=${WOPI_TOKEN_SECRET:-wopi_secret_change_me}
    depends_on:
      - mongodb
      - collabora
    networks:
      - cle_network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cle_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_COLLABORA_URL=http://localhost:9980
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - cle_network

  # Collabora Online Document Editor
  collabora:
    image: collabora/code:latest
    container_name: cle_collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      - domain=localhost:3001
      - username=admin
      - password=${COLLABORA_ADMIN_PASS:-admin}
      - server_name=collabora
      - dictionaries=en,de,fr,es
      - "extra_params=--o:ssl.enable=false"
    cap_add:
      - MKNOD
    networks:
      - cle_network

volumes:
  mongodb_data:
  file_uploads:

networks:
  cle_network:
    driver: bridge
